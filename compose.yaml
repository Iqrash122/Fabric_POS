services:
    workspace:
        build:
            context: .
            dockerfile: .devcontainer/Dockerfile
            args:
                DEV_UID: ${DEV_UID:-1000}
                DEV_GID: ${DEV_GID:-1000}
        init: true
        working_dir: /workspace
        volumes:
            - .:/workspace
        ports:
            - '127.0.0.1:8000:8000'
            - '127.0.0.1:5173:5173'
        depends_on:
            postgres:
                condition: service_healthy
    postgres:
        image: postgres:17-bookworm
        environment:
            POSTGRES_USER: stitching
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Run node scripts/workspace/configure.mjs first}
            POSTGRES_DB: stitching
        volumes:
            - stitching_pg:/var/lib/postgresql/data
            - ./.devcontainer/init-db.sql:/docker-entrypoint-initdb.d/01-testing.sql:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U stitching -d stitching']
            interval: 5s
            timeout: 5s
            retries: 20
volumes:
    stitching_pg:
